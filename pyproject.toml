[project]
name = "ai-job-copilot"
version = "0.1.0"
description = "AI-powered job application assistant for the German job market."
readme = "README.md"
authors = [
    { name = "Nikita Akhade", email = "nikitaakhade30@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
